services:
  database:
    container_name: database
    image: postgres:latest
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CAPG_USER} -d ${CAPG_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${CAPG_USER}
      POSTGRES_PASSWORD: ${CAPG_PASS}
      POSTGRES_MULTIPLE_DATABASES: ${CAPG_DBS}
    volumes:
      - database_data:/var/lib/postgresql/18/data
      - ./database/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh

  blob:
    container_name: blob
    restart: always
    image: chrislusf/seaweedfs:4.21
    command: "server -s3 -dir=/data -s3.config=/etc/seaweedfs/s3.json"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8333/"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - 9333:9333 # Master API & Web UI
      - 8333:8333 # S3 API endpoint
      - 8888:8888 # Filer Browse UI
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./blob/s3.json:/etc/seaweedfs/s3.json:ro
      - ./blob/filer.toml:/etc/seaweedfs/filer.toml:ro
      - blob_data:/data

  antivirus:
    container_name: antivirus
    restart: always
    image: clamav/clamav:1.5.2_base
    ports:
      - 3310:3310
    volumes:
      - ./antivirus/clamd.conf:/etc/clamav/clamd.conf
      - antivirus_db:/var/lib/clamav

  message-broker:
    container_name: message-broker
    restart: always
    image: rabbitmq:4.3.0-management
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${CAPG_USER}
      RABBITMQ_DEFAULT_PASS: ${CAPG_PASS}

  identity_provider:
    container_name: identity_provider
    restart: always
    image: casbin/casdoor:latest
    ports:
      - 8000:8000
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://localhost:8000/api/health",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - ./identity_provider/app.conf:/conf/app.conf:ro
      - ./identity_provider/init_data.json:/init_data.json:ro
    depends_on:
      database:
        condition: service_healthy

  api:
    container_name: api
    restart: always
    profiles:
      - debug
    build:
      context: ..\..\Visual Studio Projects\capg-cv-backend\capg-backend-api
      dockerfile: Dockerfile
    # image: camiloapaezg/capg-api:latest
    ports:
      - 8080:8080
    volumes:
      - ./api/appsettings.json:/app/appsettings.json:ro
    depends_on:
      database:
        condition: service_healthy
      message-broker:
        condition: service_healthy
      antivirus:
        condition: service_healthy
      identity_provider:
        condition: service_healthy

volumes:
  database_data:
  blob_data:
  antivirus_db:
